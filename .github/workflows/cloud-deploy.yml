name: Free-Tier Autonomous Cloud App Deployment
on:
  push:
    branches: [ "main" ]
jobs:
  deploy-to-cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Ingest Source Stream
        uses: actions/checkout@v4

      - name: Authenticate Google Cloud Engine via Active Token Securely
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_DEPLOY_TOKEN }}

      - name: Set Up Cloud SDK CLI Context
        uses: google-github-actions/setup-gcloud@v2

      - name: Execute Serverless Deployment
        run: |
          echo "==> Deploying application container dynamically..."
          gcloud run deploy music-engine-app --source=. --region=us-central1 --allow-unauthenticated --project=queenkarma-youmuseme
